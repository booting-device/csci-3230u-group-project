<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f6f1">
    <title>Papercritic | Find your next read</title>
    <link rel="preconnect" href="https://covers.openlibrary.org">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
      <aside class="sidebar" aria-label="Main navigation">
        <a class="logo" href="#top" aria-label="Papercritic home">
            <img src="concept-logo.jpg" width="30" height="30">
          <span>papercritic</span>
        </a>

        <nav class="side-nav">
          <a class="nav-link is-active" href="#top"> Discover</a>
          <a class="nav-link" href="#top"> Favorites</a>
        </nav>

      </aside>

      <main id="top" class="main-content">
        <header class="topbar">
          <form class="search" role="search" action="#top-picks">
            <input type="search" placeholder="Search books, authors, or genres">
          </form>
        </header>

        <section id="top-picks">
          <h2>Top picks</h2>
          <div class="book-grid">
            <article class="book-card">
              <a class="cover-link" aria-label="View Matilda by Roald Dahl">
                <img class="book-cover" src="https://covers.openlibrary.org/b/isbn/9780140328721-L.jpg" alt="Cover of the Fantastic Mr. Foxl">
              </a>
              <div class="book-info">
                <p>Roald Dahl</p>
              </div>
            </article>
            <article class="book-card">
              <a class="cover-link" aria-label="View Matilda by Roald Dahl">
                <img class="book-cover" src="https://covers.openlibrary.org/b/isbn/978-1982143657-L.jpg" alt="Cover for It Ends with us">
              </a>
              <div class="book-info">
                <p>Colleen Hoover</p>
              </div>
            </article>
            <article class="book-card">
              <a class="cover-link" aria-label="View Matilda by Roald Dahl">
                <img class="book-cover" src="https://covers.openlibrary.org/b/isbn/978-1635575569-L.jpg" alt="Cover of the Fantastic Mr. Foxl">
              </a>
              <div class="book-info">
                <p>Sarah J. Maas</p>
              </div>
            </article>
          </div>
        </section>

        <section id="favorites">
          <h2>Our Favourites</h2>
          <div class="book-grid">
            <article class="book-card">
              <a class="cover-link" aria-label="View Matilda by Roald Dahl">
                <img class="book-cover" src="https://covers.openlibrary.org/b/isbn/978-1-4197-4185-2-L.jpg" alt="Cover of the Fantastic Mr. Foxl">
              </a>
              <div class="book-info">
                <p>Jeff Kinney</p>
              </div>
            </article>
            <article class="book-card">
              <a class="cover-link" aria-label="View Matilda by Suzanne Collins">
                <img class="book-cover" src="https://covers.openlibrary.org/b/isbn/978-0439023481-L.jpg" alt="Cover for It Ends with us">
              </a>
              <div class="book-info">
                <p>Colleen Hoover</p>
              </div>
            </article>
            <article class="book-card">
              <a class="cover-link" aria-label="View Matilda by Roald Dahl">
                <img class="book-cover" src="https://covers.openlibrary.org/b/isbn/978-0451524935-L.jpg" alt="Cover of the Fantastic Mr. Foxl">
              </a>
              <div class="book-info">
                <p>George Orwell</p>
              </div>
            </article>
          </div>
        </section>
      </main>
  </body>
</html>
